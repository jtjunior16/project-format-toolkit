# CI for the plugin itself: runs on every push to main and every PR (universal-rules §6).
# Gates: PR title (PRs only) → secret scan (gitleaks) → lint (ruff) → selftest (scaffolds throwaway repos, exercises every hook).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, synchronize, reopened]  # `edited`: re-check when the title changes

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.3.3   # setup-uv has no floating v10 tag: pin the full version

      - name: PR title is a Conventional Commit (it becomes the squash commit on main)
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "$TITLE" > "$RUNNER_TEMP/pr-title"
          uv run --no-project python skills/project-starter/templates/scripts/check_commit_msg.py "$RUNNER_TEMP/pr-title"

      - name: Install dev tools
        run: uv sync --locked

      - name: Secret scan (gitleaks, same config as local hooks)
        run: uv run pre-commit run gitleaks --all-files

      - name: Lint and format check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Selftest
        run: uv run bash tests/selftest.sh
